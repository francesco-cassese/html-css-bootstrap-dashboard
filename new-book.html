<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        Collegament bootstrap CSS
    -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!--
            Collegamento bootstrap icone
        -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!--
        Collegamento CSS
    -->
    <link rel="stylesheet" href="./css/style.css">
    <title>Add new book</title>
</head>

<body>
    <header>
        <!--
            NAVBAR
        -->
        <nav class="navbar navbar-expand-lg bg-dark mb-3 ">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="./img/duck.png" alt="Icona papera" width="40" height="40">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav text-nowrap">
                        <li class="nav-item ">
                            <a class="nav-link active" aria-current="page" href="#">Catalogo libri</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Anagrafica Utenti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Storico prestiti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Help</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>

        <!--
        SEZIONE AGGIUNGI NUOVO LIBRO
        -->
        <section class="add-new-book container mt-4">
            <header class="header-section-add-book">
                <h2 class="title-section-add-book">Nuovo Libro</h2>
            </header>
            <!--
                INPUT NOME AUTORE
            -->
            <form class="row">
                <div class="mb-3 col-6">
                    <label for="nameAuthor" class="form-label fw-semibold">Nome Autore</label>
                    <input type="text" class="form-control" id="nameAuthor" placeholder="Inserisci il nome dell'autore"
                        aria-describedby="Nome Autore" required>
                </div>
                <!--
                    INPUT COGNOME AUTORE
                -->
                <div class="mb-3 col-6">
                    <label for="surnameAuthor" class="form-label fw-semibold">Cognome Autore</label>
                    <input type="text" class="form-control" id="surnameAuthor"
                        placeholder="Inserisci il cognome dell'autore" aria-describedby="Cognome autore">
                </div>
                <!--
                    INPUT TITOLO LIBRO
                -->
                <div class="mb-3 col-12">
                    <label for="titleBook" class="form-label fw-semibold">Titolo</label>
                    <input type="text" class="form-control" id="titleBook" placeholder="Inserisci il titolo del libro"
                        aria-describedby="Titolo libro" required>
                    <div id="titleHelp">
                        <span class="txt-title-help form-text text-secondary">Titolo versione italiana</span>
                    </div>
                </div>
                <!--
                    SELECT GENERE    
                -->
                <div class="mb-3 col-12 col-md-4 mb-3">
                    <label for="selectGenre" class="form-label fw-semibold">Genere</label>
                    <select class="form-select" id="selectGenre" aria-label="Seleziona il genere" required>
                        <option selected disabled>Scegli il genere</option>
                        <option value="fantasy">Fantasy</option>
                        <option value="thriller">Thriller</option>
                        <option value="giallo">Giallo</option>
                        <option value="horror">Horror</option>
                        <option value="sciFi">Fantascienza</option>
                        <option value="romance">Romanzo</option>
                        <option value="story">Storico</option>
                        <option value="adventure">Avventura</option>
                    </select>
                </div>
                <!--
                    INPUT ANNO DI PUBBLICAZIONE
                -->
                <div class="mb-3 col-12 col-md-4">
                    <label for="publicationDate" class="form-label fw-semibold">Anno di pubblicazione</label>
                    <input type="date" class="form-control" id="pubblicationDate" placeholder="Inserisci l'anno"
                        aria-describedby="Anno di pubblicazione">
                </div>
                <!-- 
                    INPUT CODICE ISBN
                -->
                <div class="mb-3 col-12 col-md-4 mb-5">
                    <label for="isbnCode" class="form-label fw-semibold">ISBN#</label>
                    <input type="text" class="form-control" id="isbnCode" placeholder="Inserisci il codice ISBN#"
                        aria-describedby="Anno di pubblicazione">
                </div>
                <hr class="separator">
                <!--
                    TEXT AREA
                -->
                <div class="form-label mt-3 mb-3 notes-contain pt-3">
                    <label for="notes" class="fw-semibold">Note</label>
                    <textarea class="form-control notes-txt-area" id="notes"
                        placeholder="inserisci eventuali note sul libro" id="noteTextArea"></textarea>
                </div>
                <!--
                    CHECKBOX
                -->
                <div class="col-12 mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="digitalVersionAvaiable">
                        <label class="form-check-label fw-semibold" for="digitalVersionAvaiable">
                            Disponibile anche in digitale
                        </label>
                    </div>
                </div>
                <!--
                    BOTTONE
                -->
                <div class="col-12 mb-3">
                    <button class="btn btn-primary fw-bold" type="submit">Aggiungi libro</button>
                </div>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
